services:
  # Backend API
  - type: web
    name: rolerunner-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rolerunner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rolerunner-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://rolerunner-frontend.onrender.com,http://localhost:5173

  # Frontend Static Site
  - type: web
    name: rolerunner-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rolerunner-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis Service
  - type: redis
    name: rolerunner-redis
    ipAllowList: []
    plan: free

databases:
  # PostgreSQL Database
  - name: rolerunner-db
    databaseName: rolerunner
    user: rolerunner
    plan: free
